{% set name = "colligo" %}
{% set version = "0.2.0" %}
{# Filled at release, from the tag: sha256sum of the tarball below, and git rev-list -n 1 v<version>. #}
{% set sha256 = "6c2bb71a1b9bb552eb2968ae18d9167a46a9e51378772d1ecbbaaaed745283fc" %}
{% set commit = "1f8f6241e09284996b88ea124fd8ddc553ba8ccd" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/colligo-go/colligo/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script_env:
    - COLLIGO_COMMIT={{ commit }}
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('go-nocgo') }}
    - go-licenses

test:
  files:
    - tiny.fastq
  commands:
    - colligo version | grep "^colligo v{{ version }} " > /dev/null
    - colligo check tiny.fastq
    - "colligo check --json tiny.fastq | grep '\"schema_version\": 2' > /dev/null"

about:
  home: https://github.com/colligo-go/colligo
  dev_url: https://github.com/colligo-go/colligo
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - thirdparty/
  summary: Check that the genomic data you have is the data you think you have

extra:
  recipe-maintainers:
    - JVguedesF
