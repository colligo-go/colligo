name: weekly

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COLLIGO_SLOW: "1"
      COLLIGO_REQUIRE_PYTHON: "1"
      COLLIGO_REQUIRE_B3SUM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Independent verifier dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install blake3==1.0.11
          echo "COLLIGO_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: b3sum from source
        run: cargo install b3sum --version 1.8.7 --locked

      - name: Slow tests
        run: go test -race -count=1 -timeout 100m ./...

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzComputeGzip, package: ./facts }
          - { target: FuzzValidateFastq, package: ./format }
          - { target: FuzzValidateFasta, package: ./format }
          - { target: FuzzValidateGTF, package: ./format }
          - { target: FuzzCollectorChunking, package: ./identity }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz corpus from previous weeks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-

      - name: Fuzz 30 min
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30m ${{ matrix.package }}

      - name: Failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: "*/testdata/fuzz/${{ matrix.target }}"
          if-no-files-found: ignore
