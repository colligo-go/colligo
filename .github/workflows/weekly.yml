name: weekly

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COLLIGO_SLOW: "1"
      COLLIGO_REQUIRE_PYTHON: "1"
      COLLIGO_REQUIRE_B3SUM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Independent verifier dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install blake3==1.0.11
          echo "COLLIGO_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: b3sum from source
        run: cargo install b3sum --version 1.8.7 --locked

      - name: Slow tests
        run: go test -race -count=1 -timeout 100m ./...

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzComputeGzip, package: ./facts }
          - { target: FuzzValidateFastq, package: ./format }
          - { target: FuzzValidateFasta, package: ./format }
          - { target: FuzzValidateGTF, package: ./format }
          - { target: FuzzCollectorChunking, package: ./identity }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz corpus from previous weeks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-

      - name: Fuzz 30 min
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30m ${{ matrix.package }}

      - name: Failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: "*/testdata/fuzz/${{ matrix.target }}"
          if-no-files-found: ignore

  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compare the recorded ENA responses with today's
        id: compare
        run: |
          set +e
          go run ./internal/drift/cmd/drift | tee "$RUNNER_TEMP/drift.txt"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi

      - name: Report the drift in an issue
        if: steps.compare.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The ENA answer differs from the recorded fixtures in \`source/ena/testdata\`, in the structure Colligo reads or in the values it uses (public metadata of the recorded runs)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/drift.txt"
            echo '```'
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Re-record the fixtures as described in \`source/ena/testdata/README.md\` and adapt \`source/ena\` to the new format."
          } > "$RUNNER_TEMP/issue.md"
          gh label create fixture-drift --color B60205 --description "A source changed the format of its response" 2>/dev/null || true
          number=$(gh issue list --state open --label fixture-drift --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --label fixture-drift --title "ENA fixtures have drifted from the live API" --body-file "$RUNNER_TEMP/issue.md"
          fi
          exit 1
