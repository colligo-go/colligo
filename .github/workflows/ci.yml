name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      COLLIGO_REQUIRE_PYTHON: "1"
      COLLIGO_REQUIRE_B3SUM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Naming rules self-test
        run: bash .github/check-names.sh --self-test

      - name: Branch name and commit messages
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/check-names.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Independent verifier dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install blake3==1.0.11
          echo "COLLIGO_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: b3sum from source
        run: cargo install b3sum --version 1.8.7 --locked

      - name: Secrets in history
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose .

      - name: No real fixture tracked
        run: test -z "$(git ls-files testdata/real)"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - run: go build ./...

      - run: go vet ./...

      - name: noleak
        run: |
          go build -o "$RUNNER_TEMP/noleak" ./internal/noleak/cmd/noleak
          go vet -vettool="$RUNNER_TEMP/noleak" ./...

      - name: Tests
        run: go test -race -count=2 ./...

  multiqc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        multiqc: ["1.30", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the module and MultiQC ${{ matrix.multiqc }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "${{ matrix.multiqc }}" = latest ]; then
            "$RUNNER_TEMP/venv/bin/pip" install './tools/multiqc[test]'
          else
            "$RUNNER_TEMP/venv/bin/pip" install './tools/multiqc[test]' 'multiqc==${{ matrix.multiqc }}'
          fi
          "$RUNNER_TEMP/venv/bin/pip" list | grep -i '^multiqc'

      - name: Tests
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest tools/multiqc

  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzComputeGzip, package: ./facts }
          - { target: FuzzValidateFastq, package: ./format }
          - { target: FuzzValidateFasta, package: ./format }
          - { target: FuzzValidateGTF, package: ./format }
          - { target: FuzzCollectorChunking, package: ./identity }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz 60 s
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s ${{ matrix.package }}

      - name: Failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: "*/testdata/fuzz/${{ matrix.target }}"
          if-no-files-found: ignore
